name: Build Dragon Code Z V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dragon-code-z.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Materialize V3 builder
        shell: bash
        env:
          BUILD_ZLIB_B64: ''
        run: |
          mkdir -p _src
          python - <<'PY'
          import os, base64, zlib
          from pathlib import Path
          payload = os.environ['BUILD_ZLIB_B64']
          Path('_src/build.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY

      - name: Generate V3 README and animated HUD assets
        run: python _src/build.py

      - name: Commit generated profile
        shell: bash
        run: |
          git config user.name 'Dragon Code Z Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md ASSET_SOURCES.md PROFILE_NOTES.md _src/build.py assets/
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Deploy Dragon Code Z V3'
          git push
