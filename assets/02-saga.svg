<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Current systems saga</title><desc id="desc">Dragon Ball inspired developer interface for SUNDAYS. Original vector artwork.</desc>
<defs>
<filter id="glowG" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowO" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
<linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7BFF72"/><stop offset="1" stop-color="#14D85C"/></linearGradient>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#02050A"/><stop offset=".58" stop-color="#07120D"/><stop offset="1" stop-color="#020403"/></linearGradient>
<radialGradient id="gOrange"><stop offset="0" stop-color="#FFE59A"/><stop offset=".5" stop-color="#FF8B18"/><stop offset="1" stop-color="#A83A00"/></radialGradient>
<radialGradient id="gMoon"><stop offset="0" stop-color="#FFEFB2" stop-opacity=".9"/><stop offset=".58" stop-color="#FFD447" stop-opacity=".4"/><stop offset="1" stop-color="#FF8B18" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#163126" stroke-width="1" opacity=".55"/></pattern>
<pattern id="micro" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#7BFF72" stroke-width=".4" opacity=".08"/></pattern>
</defs><style>
@keyframes blink{0%,46%,54%,100%{opacity:1}50%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(-140px)}to{transform:translateY(800px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes aura{0%,100%{opacity:.28;transform:scale(.985)}50%{opacity:.76;transform:scale(1.025)}}
@keyframes dash{to{stroke-dashoffset:-140}}
@keyframes glitch{0%,92%,100%{transform:translate(0)}93%{transform:translate(-5px,2px)}95%{transform:translate(4px,-2px)}97%{transform:translate(-2px,1px)}}
@keyframes ping{0%{r:9;opacity:.9}100%{r:42;opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes spark{0%{opacity:0;stroke-dashoffset:90}20%{opacity:1}70%{opacity:.7}100%{opacity:0;stroke-dashoffset:-90}}
@keyframes breathe{0%,100%{opacity:.18}50%{opacity:.42}}
@keyframes bars{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes orb{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="1200" height="400" fill="#030507"/><rect x="14" y="14" width="1172" height="372" rx="22" fill="none" stroke="#163126" stroke-width="2"/><path d="M14 82H1186" stroke="#163126"/><path d="M34 61V34H61 M1139 34H1166V61 M34 339V366H61 M1139 366H1166V339" fill="none" stroke="#7BFF72" stroke-width="3" opacity=".82"/><text x="54" y="58" fill="#FFD447" opacity="1" font-family="'Courier New', monospace" font-size="18" font-weight="900" text-anchor="start" letter-spacing="2">CURRENT ARC // SYSTEMS SAGA</text><text x="1148" y="58" fill="#7BFF72" opacity="1" font-family="'Courier New', monospace" font-size="12" font-weight="800" text-anchor="end" letter-spacing="1.4">ARC 02 // IN PROGRESS</text><text x="58" y="120" fill="#F7F8EF" opacity="1" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="30" font-weight="900" text-anchor="start" letter-spacing="1.8">FROM RAW SIGNAL → RELIABLE SYSTEM</text><text x="58" y="151" fill="#98A79F" opacity="1" font-family="'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">Every build is another training arc.</text><path d="M92 255 H938" stroke="#163126" stroke-width="6" stroke-linecap="round"/><circle cx="92" cy="255" r="34" fill="#09110e" stroke="#7BFF72" stroke-width="3"/><circle cx="92" cy="255" r="49" fill="none" stroke="#7BFF72" stroke-width="1" stroke-dasharray="5 10" opacity=".35" style="transform-origin:92px 255px;animation:orb 11s linear infinite"/><text x="92" y="261" fill="#7BFF72" opacity="1" font-family="'Courier New', monospace" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="0">01</text><text x="92" y="335" fill="#F7F8EF" opacity="1" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1.2">SIGNAL</text><text x="92" y="361" fill="#98A79F" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.6">IDENTIFY THE REAL PROBLEM</text><text x="92" y="194" fill="#7BFF72" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1.4">COMPLETE</text><circle cx="374" cy="255" r="34" fill="#09110e" stroke="#FFD447" stroke-width="3"/><circle cx="374" cy="255" r="49" fill="none" stroke="#FFD447" stroke-width="1" stroke-dasharray="5 10" opacity=".35" style="transform-origin:374px 255px;animation:orb 13s linear infinite"/><text x="374" y="261" fill="#FFD447" opacity="1" font-family="'Courier New', monospace" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="0">02</text><text x="374" y="335" fill="#F7F8EF" opacity="1" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1.2">BUILD</text><text x="374" y="361" fill="#98A79F" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.6">SHIP THE WORKING SYSTEM</text><text x="374" y="194" fill="#FFD447" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1.4">ACTIVE</text><circle cx="656" cy="255" r="34" fill="#09110e" stroke="#43C9FF" stroke-width="3"/><circle cx="656" cy="255" r="49" fill="none" stroke="#43C9FF" stroke-width="1" stroke-dasharray="5 10" opacity=".35" style="transform-origin:656px 255px;animation:orb 15s linear infinite"/><text x="656" y="261" fill="#43C9FF" opacity="1" font-family="'Courier New', monospace" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="0">03</text><text x="656" y="335" fill="#F7F8EF" opacity="1" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1.2">AUTOMATE</text><text x="656" y="361" fill="#98A79F" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.6">TURN MOTION INTO LEVERAGE</text><text x="656" y="194" fill="#43C9FF" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1.4">TRAINING</text><circle cx="938" cy="255" r="34" fill="#09110e" stroke="#FF8B18" stroke-width="3"/><circle cx="938" cy="255" r="49" fill="none" stroke="#FF8B18" stroke-width="1" stroke-dasharray="5 10" opacity=".35" style="transform-origin:938px 255px;animation:orb 17s linear infinite"/><text x="938" y="261" fill="#FF8B18" opacity="1" font-family="'Courier New', monospace" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="0">04</text><text x="938" y="335" fill="#F7F8EF" opacity="1" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1.2">SCALE</text><text x="938" y="361" fill="#98A79F" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.6">HARDEN / MEASURE / EXPAND</text><text x="938" y="194" fill="#FF8B18" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1.4">LOCKED</text><circle cx="374" cy="255" r="35" fill="none" stroke="#FFD447" stroke-width="2" style="animation:ping 2s ease-out infinite"/></svg>