<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Hyperbolic training room</title><desc id="desc">Dragon Ball inspired developer interface for SUNDAYS. Original vector artwork.</desc>
<defs>
<filter id="glowG" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowO" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
<linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7BFF72"/><stop offset="1" stop-color="#14D85C"/></linearGradient>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#02050A"/><stop offset=".58" stop-color="#07120D"/><stop offset="1" stop-color="#020403"/></linearGradient>
<radialGradient id="gOrange"><stop offset="0" stop-color="#FFE59A"/><stop offset=".5" stop-color="#FF8B18"/><stop offset="1" stop-color="#A83A00"/></radialGradient>
<radialGradient id="gMoon"><stop offset="0" stop-color="#FFEFB2" stop-opacity=".9"/><stop offset=".58" stop-color="#FFD447" stop-opacity=".4"/><stop offset="1" stop-color="#FF8B18" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#163126" stroke-width="1" opacity=".55"/></pattern>
<pattern id="micro" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#7BFF72" stroke-width=".4" opacity=".08"/></pattern>
</defs><style>
@keyframes blink{0%,46%,54%,100%{opacity:1}50%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(-140px)}to{transform:translateY(800px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes aura{0%,100%{opacity:.28;transform:scale(.985)}50%{opacity:.76;transform:scale(1.025)}}
@keyframes dash{to{stroke-dashoffset:-140}}
@keyframes glitch{0%,92%,100%{transform:translate(0)}93%{transform:translate(-5px,2px)}95%{transform:translate(4px,-2px)}97%{transform:translate(-2px,1px)}}
@keyframes ping{0%{r:9;opacity:.9}100%{r:42;opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes spark{0%{opacity:0;stroke-dashoffset:90}20%{opacity:1}70%{opacity:.7}100%{opacity:0;stroke-dashoffset:-90}}
@keyframes breathe{0%,100%{opacity:.18}50%{opacity:.42}}
@keyframes bars{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes orb{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="1200" height="440" fill="#030507"/><rect x="14" y="14" width="1172" height="412" rx="22" fill="none" stroke="#163126" stroke-width="2"/><path d="M14 82H1186" stroke="#163126"/><path d="M34 61V34H61 M1139 34H1166V61 M34 379V406H61 M1139 406H1166V379" fill="none" stroke="#7BFF72" stroke-width="3" opacity=".82"/><text x="54" y="58" fill="#FFD447" opacity="1" font-family="'Courier New', monospace" font-size="18" font-weight="900" text-anchor="start" letter-spacing="2">HYPERBOLIC TRAINING ROOM</text><text x="1148" y="58" fill="#7BFF72" opacity="1" font-family="'Courier New', monospace" font-size="12" font-weight="800" text-anchor="end" letter-spacing="1.4">TIME LIMIT // DISABLED</text><rect x="56" y="111" width="286" height="277" rx="22" fill="#F5EFD9" stroke="#FFF" stroke-width="2"/><circle cx="199" cy="236" r="99" fill="#E7E1CF" stroke="#BBB5A5" stroke-width="3"/><rect x="151" y="150" width="96" height="168" rx="48" fill="#050707"/><ellipse cx="199" cy="314" rx="72" ry="15" fill="#CFC9B8" opacity=".72"/><text x="199" y="359" fill="#333" opacity="1" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="2">TIME ≠ LIMIT</text><rect x="386" y="112" width="760" height="87" rx="17" fill="#09110e" stroke="#163126"/><text x="410" y="141" fill="#7BFF72" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="start" letter-spacing="1.4">TRAINING 01</text><text x="410" y="171" fill="#F7F8EF" opacity="1" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" letter-spacing="1">AGENT ARCHITECTURE</text><text x="711" y="152" fill="#98A79F" opacity="1" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="start" letter-spacing="0">Design specialized systems that reason, route and execute.</text><circle cx="1107" cy="155" r="11" fill="none" stroke="#7BFF72" stroke-width="2"/><circle cx="1107" cy="155" r="4" fill="#7BFF72" style="animation:pulse 1.4s ease infinite"/><rect x="386" y="213" width="760" height="87" rx="17" fill="#09110e" stroke="#163126"/><text x="410" y="242" fill="#7BFF72" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="start" letter-spacing="1.4">TRAINING 02</text><text x="410" y="272" fill="#F7F8EF" opacity="1" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" letter-spacing="1">AUTOMATION</text><text x="711" y="253" fill="#98A79F" opacity="1" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="start" letter-spacing="0">Turn repetitive work into reliable operating leverage.</text><circle cx="1107" cy="256" r="11" fill="none" stroke="#7BFF72" stroke-width="2"/><circle cx="1107" cy="256" r="4" fill="#7BFF72" style="animation:pulse 1.4s ease infinite"/><rect x="386" y="314" width="760" height="87" rx="17" fill="#09110e" stroke="#163126"/><text x="410" y="343" fill="#7BFF72" opacity="1" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="start" letter-spacing="1.4">TRAINING 03</text><text x="410" y="373" fill="#F7F8EF" opacity="1" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="20" font-weight="900" text-anchor="start" letter-spacing="1">PRODUCT SYSTEMS</text><text x="711" y="354" fill="#98A79F" opacity="1" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="start" letter-spacing="0">Build interfaces and tools people can actually run with.</text><circle cx="1107" cy="357" r="11" fill="none" stroke="#7BFF72" stroke-width="2"/><circle cx="1107" cy="357" r="4" fill="#7BFF72" style="animation:pulse 1.4s ease infinite"/></svg>